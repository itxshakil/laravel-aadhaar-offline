name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# All jobs run in parallel; nothing waits on lint or static analysis.
# Dependency installs are cached per OS/PHP/strategy by ramsey/composer-install.
jobs:
    lint:
        name: Lint (Pint)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  tools: composer
                  coverage: none

            - uses: ramsey/composer-install@v4

            - run: vendor/bin/pint --test

            - name: Lint GitHub Actions workflows
              uses: raven-actions/actionlint@v2

    analyse:
        name: Static Analysis (PHPStan)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  tools: composer
                  coverage: none

            - uses: ramsey/composer-install@v4

            - run: php -d memory_limit=1G vendor/bin/phpstan analyse

    packagist:
        name: Composer / Packagist Validation
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  tools: composer
                  coverage: none

            - run: composer validate --strict
            - run: composer dump-autoload --dry-run --optimize

    test:
        name: Tests (PHP ${{ matrix.php }} | Laravel ${{ matrix.laravel }} | ${{ matrix.os }} | ${{ matrix.deps }})
        runs-on: ${{ matrix.os }}

        # Full PHP x Laravel x dependency matrix on Linux, so every supported Laravel
        # major is tested (a "lowest" run alone resolves to Laravel 12, never 11).
        # macOS and Windows only on the oldest and newest PHP with the newest Laravel,
        # which keeps macOS jobs under the free-plan concurrency limit.
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                php: [8.3, 8.4, 8.5]
                laravel: [11, 12, 13]
                deps: [lowest, highest]
                exclude:
                    - { laravel: 11, php: 8.5 }
                include:
                    - { laravel: 11, testbench: "9.*" }
                    - { laravel: 12, testbench: "10.*" }
                    - { laravel: 13, testbench: "11.*" }
                    - { os: macos-latest, php: 8.3, laravel: 13, testbench: "11.*", deps: highest }
                    - { os: macos-latest, php: 8.5, laravel: 13, testbench: "11.*", deps: highest }
                    - { os: windows-latest, php: 8.3, laravel: 13, testbench: "11.*", deps: highest }
                    - { os: windows-latest, php: 8.5, laravel: 13, testbench: "11.*", deps: highest }

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, mbstring, zip, zlib, fileinfo, pdo_sqlite, sqlite3
                  tools: composer
                  coverage: none

            # "N.*" instead of "^N.0": on Windows composer runs through a .bat file, and cmd eats "^".
            - name: Pin Laravel ${{ matrix.laravel }}
              run: composer require --dev --no-update "laravel/framework:${{ matrix.laravel }}.*" "orchestra/testbench:${{ matrix.testbench }}"

            - uses: ramsey/composer-install@v4
              with:
                  dependency-versions: ${{ matrix.deps }}

            - run: vendor/bin/phpunit

    # One stable check to require in branch protection, instead of every matrix
    # job by name (those names change whenever the matrix does).
    ci-passed:
        name: CI passed
        if: always()
        needs: [lint, analyse, packagist, test]
        runs-on: ubuntu-latest
        steps:
            - name: Fail if any required job failed or was cancelled
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
            - run: echo "All CI jobs passed."
